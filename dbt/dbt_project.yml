name: 'kinetic'
version: '1.0.0'
config-version: 2

profile: 'kinetic'

model-paths: ["models"]
clean-targets: ["target", "dbt_packages"]

models:
  kinetic:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
