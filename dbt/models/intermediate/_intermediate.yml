version: 2

models:
  - name: int_subscription_paid_periods
    description: >
      One row per subscription, with paid_start_date resolved (null if the
      subscription was canceled during its trial and never actually paid).
      This is the single source of truth for "is this subscription actively
      paying as of date X" used by every mart below.
    columns:
      - name: subscription_id
        data_tests: [not_null, unique]

  - name: int_orders_refunded
    description: >
      One row per order with at least one succeeded refund, with the total
      refunded amount. Orders with no successful refund are absent (not a
      zero row) -- always LEFT JOIN and COALESCE to 0 when using this.
    columns:
      - name: order_id
        data_tests: [not_null, unique]

  - name: int_customer_identity
    description: >
      Lookup table: one row per identifier (a web anonymous_id or an email
      address) that can be traced to a customer account. Join on
      identifier_key ('anonymous_id:<id>' or 'email:<lowercased email>') to
      find out which customer a guest order, Braze guest email, or anonymous
      web session belongs to. Guest emails are matched to accounts by email;
      anonymous sessions before signup/login are back-filled. Deleted
      accounts are excluded.
    columns:
      - name: identifier_key
        data_tests: [not_null, unique]
      - name: identifier_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['anonymous_id', 'email']
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_kinetic__customers')
                field: customer_id
      - name: match_method
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['identity_map_signup', 'identity_map_login', 'account_email']

  - name: int_orders_net
    description: >
      One row per order with the money broken out once: gross_usd (subtotal
      before discounts), discount_usd (subscriber discount + code), paid_usd
      (what was charged), refund_usd (succeeded refunds only, 0 if none) and
      net_usd (paid minus refund, never floored at zero). customer_id is the
      order's account or, for guest orders, the account matched by email via
      int_customer_identity; unmatched guests stay null. is_guest_order stays
      true for anyone who checked out as a guest. Net is not a margin figure
      (no COGS data exists).
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_kinetic__orders')
                field: order_id
      - name: gross_usd
        data_tests: [not_null]
      - name: discount_usd
        data_tests: [not_null]
      - name: paid_usd
        data_tests: [not_null]
      - name: refund_usd
        data_tests: [not_null]
      - name: net_usd
        data_tests: [not_null]
      - name: is_guest_order
        data_tests: [not_null]
      - name: customer_id
        description: Null only for guest orders with no matching account.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_kinetic__customers')
                field: customer_id
      - name: customer_resolution
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['account', 'guest_email_match', 'unresolved']
