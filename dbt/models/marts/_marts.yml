version: 2

models:
  - name: mart_mrr_monthly
    description: >
      Canonical Monthly Recurring Revenue and active-subscriber-count by
      month. This is the one place MRR/ARR are defined for the whole
      project -- dashboards and future marts should query this rather than
      recomputing the trial/paid-start logic themselves. Each row is a
      snapshot on the 1st of the month. Rows stop at the last month the
      data covers (see data_through).
    columns:
      - name: year_month
        data_tests: [not_null, unique]
      - name: mrr_usd
        data_tests:
          - not_null
      - name: data_through
        description: >
          Latest date the subscription/invoice data covers. The mart never
          goes past this month; MRR for later months is unknown, not zero.
        data_tests: [not_null]

  - name: mart_storefront_revenue_monthly
    description: >
      Canonical non-subscription (course + merch) storefront revenue by
      month, built on int_orders_net. gross_before_discount_usd is the
      subtotal before discounts; discount_usd is what discounts took off;
      paid_revenue_usd is what customers were charged (gross minus discount;
      this was called gross_revenue_usd before 2026-09-30). net_revenue_usd
      is paid minus successful refunds only -- not a true gross margin (no
      COGS data exists). AOV is paid revenue per order. Rows stop at the
      latest order date in the data (see data_through).
    columns:
      - name: year_month
        data_tests: [not_null, unique]
      - name: order_count
        data_tests: [not_null]
      - name: gross_before_discount_usd
        description: Order subtotals before any discount, in US dollars.
      - name: discount_usd
        description: Subscriber discounts plus discount codes, in US dollars.
      - name: paid_revenue_usd
        description: What customers were charged (gross minus discounts), before refunds. Formerly gross_revenue_usd.
        data_tests: [not_null]
      - name: net_revenue_usd
        description: Paid revenue minus succeeded refunds. Not a margin figure.
        data_tests: [not_null]
      - name: data_through
        description: Latest order date in the data; later months are unknown, not zero.
        data_tests: [not_null]

  - name: mart_subscriber_movement_monthly
    description: >
      Paying-subscriber movement by month: new paying subscribers (split into
      first_time and returning win-backs), churned subscribers, net new and
      active subscribers at month end. "Paying" starts when the trial
      converts (a trial canceled before converting never counts). A returning
      subscriber is someone with an earlier paying subscription, so
      first_time + returning = new. Counts people-subscriptions, not revenue:
      use mart_mrr_monthly for dollars. Active at month end can differ from
      mart_mrr_monthly's count on the 1st only when someone starts or cancels
      on the 1st. Rows stop at the data's last month (see data_through);
      later months are unknown, not zero.
    columns:
      - name: year_month
        data_tests: [not_null, unique]
      - name: new_paying_subscribers
        data_tests: [not_null]
      - name: churned_subscribers
        description: Paying subscriptions canceled that month (canceled trials are not included).
        data_tests: [not_null]
      - name: net_new_subscribers
        description: New paying minus churned; negative means the base shrank.
        data_tests: [not_null]
      - name: active_subscribers_end
        data_tests: [not_null]
      - name: data_through
        description: Latest date the subscription data covers.
        data_tests: [not_null]
