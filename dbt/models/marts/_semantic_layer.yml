# ======================================================================
# Phase 6 semantic layer (dbt Semantic Layer / MetricFlow)
# Validated 2026-09-30: `dbt parse` and `mf validate-configs` pass with
# 0 errors, and the 10 queries in docs/semantic_layer_validation.md return
# the expected values. Needs the metricflow_time_spine model (same folder).
#
# Entity names: each semantic model has its own (mrr_month, ...), because
# MetricFlow rejects the reserved word `month` and rejects two models that
# share an entity + dimension pair. Queries across models still line up on
# metric_time. The platform dimension is queried as platform_month__platform.
#
# ASSUMED DEFAULT (Ben's call): dbt Semantic Layer / MetricFlow rather than a
# BI-tool semantic layer, because Kinetic has no BI tool.
#
# Rule of this file: each metric is defined ONCE. The allowed dimensions are
# the ones declared on its semantic model plus metric_time (month, quarter,
# year). Anything not declared here is not answerable and the Skill must say
# so.
#
# Honest limit of today's marts: only the paid-media metrics have a second
# dimension (platform). Every other mart is one row per month, so those
# metrics can be sliced by time only. The Phase 6 exit check ("at least 2
# approved dimensions without a new model") is met by the paid-media metrics
# only; a by-channel or by-plan subscriber mart would be needed to meet it for
# subscribers and revenue.
# ======================================================================

semantic_models:

  # ---- Recurring revenue: a SNAPSHOT on the 1st of each month ----------
  - name: mrr
    description: >
      Monthly recurring revenue and paying subscribers, snapshotted on the
      1st of each month. Snapshot numbers must never be summed across months.
    model: ref('mart_mrr_monthly')
    defaults:
      agg_time_dimension: month_start
    entities:
      - name: mrr_month
        type: primary
        expr: year_month
    dimensions:
      - name: month_start
        type: time
        type_params:
          time_granularity: month
    measures:
      - name: mrr_usd_snapshot
        description: MRR in US dollars on the 1st of the month (a run-rate, not cash).
        expr: mrr_usd
        agg: sum
        non_additive_dimension:
          name: month_start
          window_choice: max
      - name: active_subscribers_snapshot
        description: Paying subscriptions on the 1st of the month.
        expr: active_subscribers
        agg: sum
        non_additive_dimension:
          name: month_start
          window_choice: max

  # ---- Subscriber movement ----------------------------------------------
  - name: subscriber_movement
    description: Paying-subscriber flows per month (new, returning, churned).
    model: ref('mart_subscriber_movement_monthly')
    defaults:
      agg_time_dimension: month_start
    entities:
      - name: subscriber_movement_month
        type: primary
        expr: year_month
    dimensions:
      - name: month_start
        type: time
        type_params:
          time_granularity: month
    measures:
      - name: new_paying_subscribers_flow
        expr: new_paying_subscribers
        agg: sum
      - name: first_time_subscribers_flow
        expr: first_time_subscribers
        agg: sum
      - name: returning_subscribers_flow
        expr: returning_subscribers
        agg: sum
      - name: churned_subscribers_flow
        expr: churned_subscribers
        agg: sum
      - name: active_subscribers_end_snapshot
        description: Paying at the LAST day of the month.
        expr: active_subscribers_end
        agg: sum
        non_additive_dimension:
          name: month_start
          window_choice: max

  # ---- Storefront (course + merch) ----------------------------------------
  - name: storefront_revenue
    description: Course and merch orders per month.
    model: ref('mart_storefront_revenue_monthly')
    defaults:
      agg_time_dimension: month_start
    entities:
      - name: storefront_month
        type: primary
        expr: year_month
    dimensions:
      - name: month_start
        type: time
        type_params:
          time_granularity: month
    measures:
      - name: orders
        expr: order_count
        agg: sum
      - name: gross_before_discount_usd_sum
        expr: gross_before_discount_usd
        agg: sum
      - name: discount_usd_sum
        expr: discount_usd
        agg: sum
      - name: paid_revenue_usd_sum
        expr: paid_revenue_usd
        agg: sum
      - name: refunded_amount_usd_sum
        expr: refunded_amount_usd
        agg: sum
      - name: net_revenue_usd_sum
        expr: net_revenue_usd
        agg: sum

  # ---- Paid media: the only mart with a second dimension (platform) --------
  - name: paid_media
    description: >
      Advertising by platform by month. Conversions are the platforms' own
      claims and overlap; they are not Kinetic orders.
    model: ref('mart_paid_media_monthly')
    defaults:
      agg_time_dimension: month_start
    entities:
      - name: platform_month
        type: primary
        expr: platform_month_id
    dimensions:
      - name: month_start
        type: time
        type_params:
          time_granularity: month
      - name: platform
        type: categorical
    measures:
      - name: spend_usd_sum
        expr: spend_usd
        agg: sum
      - name: impressions_sum
        expr: impressions
        agg: sum
      - name: clicks_sum
        expr: clicks
        agg: sum
      - name: conversions_sum
        expr: conversions
        agg: sum
      - name: conversions_value_usd_sum
        expr: conversions_value_usd
        agg: sum

  # ---- Blended acquisition efficiency inputs -------------------------------
  - name: acquisition
    description: Total paid spend and first-time paying subscribers per month (no channel split exists).
    model: ref('mart_acquisition_efficiency_monthly')
    defaults:
      agg_time_dimension: month_start
    entities:
      - name: acquisition_month
        type: primary
        expr: year_month
    dimensions:
      - name: month_start
        type: time
        type_params:
          time_granularity: month
    measures:
      - name: acq_paid_spend_usd
        expr: paid_spend_usd
        agg: sum
      - name: acq_first_time_subscribers
        expr: first_time_subscribers
        agg: sum

  # ---- Owned channels: email and push messaging -----------------------------
  - name: messaging
    description: >
      Braze email and push by channel, campaign type and month of SEND: what was
      sent, bounced, opened, clicked and unsubscribed. The unit is messages, not people.
    model: ref('mart_messaging_monthly')
    defaults:
      agg_time_dimension: month_start
    entities:
      - name: message_month
        type: primary
        expr: message_month_id
    dimensions:
      - name: month_start
        type: time
        type_params:
          time_granularity: month
      - name: channel
        type: categorical
      - name: campaign_type
        type: categorical
    measures:
      - name: msg_sends
        expr: sends
        agg: sum
      - name: msg_bounces
        expr: bounces
        agg: sum
      - name: msg_delivered
        expr: delivered
        agg: sum
      - name: msg_opens
        expr: opens
        agg: sum
      - name: msg_clicks
        expr: clicks
        agg: sum
      - name: msg_unsubscribes
        expr: unsubscribes
        agg: sum

  # ---- Owned channels: web and app traffic -----------------------------------
  - name: traffic
    description: >
      Web and app sessions by month, traffic source and landing page. A session is
      a visit, not a person or a sale; utm tags are URL tags, not ad campaign IDs.
    model: ref('mart_traffic_monthly')
    defaults:
      agg_time_dimension: month_start
    entities:
      - name: traffic_month
        type: primary
        expr: traffic_month_id
    dimensions:
      - name: month_start
        type: time
        type_params:
          time_granularity: month
      - name: traffic_source
        type: categorical
      - name: landing_page
        type: categorical
    measures:
      - name: sessions_sum
        expr: sessions
        agg: sum
      - name: known_sessions_sum
        expr: known_sessions
        agg: sum
      - name: anonymous_sessions_sum
        expr: anonymous_sessions
        agg: sum
      - name: duration_seconds_sum
        expr: total_duration_seconds
        agg: sum

metrics:

  # ---- revenue / subscribers ------------------------------------------------
  - name: mrr_usd
    label: Monthly recurring revenue (USD)
    description: >
      MRR on the 1st of the month. A run-rate, not cash collected. Over a
      quarter or year it returns the LAST month's snapshot, not a sum.
    type: simple
    type_params:
      measure: mrr_usd_snapshot

  - name: active_subscribers
    label: Paying subscribers (1st of month)
    type: simple
    type_params:
      measure: active_subscribers_snapshot

  - name: new_paying_subscribers
    label: New paying subscribers
    type: simple
    type_params:
      measure: new_paying_subscribers_flow

  - name: first_time_subscribers
    label: First-time paying subscribers
    type: simple
    type_params:
      measure: first_time_subscribers_flow

  - name: returning_subscribers
    label: Returning (win-back) subscribers
    type: simple
    type_params:
      measure: returning_subscribers_flow

  - name: churned_subscribers
    label: Churned paying subscribers
    description: Paying subscriptions canceled. Canceled trials are not included.
    type: simple
    type_params:
      measure: churned_subscribers_flow

  - name: net_new_subscribers
    label: Net new paying subscribers
    type: derived
    type_params:
      expr: new_paying_subscribers - churned_subscribers
      metrics:
        - name: new_paying_subscribers
        - name: churned_subscribers

  - name: active_subscribers_month_end
    label: Paying subscribers (end of month)
    type: simple
    type_params:
      measure: active_subscribers_end_snapshot

  # ---- storefront -----------------------------------------------------------
  - name: storefront_orders
    label: Storefront orders
    type: simple
    type_params:
      measure: orders

  - name: storefront_gross_before_discount_usd
    label: Storefront gross before discounts (USD)
    type: simple
    type_params:
      measure: gross_before_discount_usd_sum

  - name: storefront_paid_revenue_usd
    label: Storefront revenue paid (USD)
    description: What customers were charged for course and merch orders, before refunds.
    type: simple
    type_params:
      measure: paid_revenue_usd_sum

  - name: storefront_net_revenue_usd
    label: Storefront net revenue (USD)
    description: Paid minus succeeded refunds. NOT a margin; there is no cost data.
    type: simple
    type_params:
      measure: net_revenue_usd_sum

  - name: storefront_aov_usd
    label: Average order value (USD)
    description: Paid revenue divided by orders, computed from sums so longer periods are weighted correctly.
    type: ratio
    type_params:
      numerator: storefront_paid_revenue_usd
      denominator: storefront_orders

  # ---- paid media (dimensions: platform, metric_time) ------------------------
  - name: paid_spend_usd
    label: Paid media spend (USD)
    type: simple
    type_params:
      measure: spend_usd_sum

  - name: paid_impressions
    label: Paid media impressions
    type: simple
    type_params:
      measure: impressions_sum

  - name: paid_clicks
    label: Paid media clicks
    type: simple
    type_params:
      measure: clicks_sum

  - name: paid_reported_conversions
    label: Platform-reported conversions
    description: >
      Each platform's own conversion claim (Meta: purchases only). Overlaps
      between platforms; never treat as Kinetic orders or add across platforms
      as if they were sales.
    type: simple
    type_params:
      measure: conversions_sum

  - name: paid_reported_conversion_value_usd
    label: Platform-reported conversion value (USD)
    description: Platform-reported conversion value; Meta reports none.
    type: simple
    type_params:
      measure: conversions_value_usd_sum

  - name: paid_ctr
    label: Click-through rate (fraction)
    type: ratio
    type_params:
      numerator: paid_clicks
      denominator: paid_impressions

  - name: paid_cpc_usd
    label: Cost per click (USD)
    type: ratio
    type_params:
      numerator: paid_spend_usd
      denominator: paid_clicks

  - name: paid_cost_per_reported_conversion_usd
    label: Cost per platform-reported conversion (USD)
    description: Not Kinetic's true acquisition cost; see blended_cac_usd for the whole-business figure.
    type: ratio
    type_params:
      numerator: paid_spend_usd
      denominator: paid_reported_conversions

  - name: paid_reported_roas
    label: Platform-reported ROAS
    description: >
      Platform-reported conversion value divided by spend. Not true ROAS.
      Meta has no value, so a Meta or all-platform ratio is understated;
      only query by platform and exclude meta.
    type: ratio
    type_params:
      numerator: paid_reported_conversion_value_usd
      denominator: paid_spend_usd

  # ---- blended acquisition (time only) ---------------------------------------
  - name: acq_paid_spend_usd
    label: Paid media spend, all platforms (USD)
    type: simple
    type_params:
      measure: acq_paid_spend_usd

  - name: acq_first_time_subscribers
    label: First-time paying subscribers (acquisition view)
    type: simple
    type_params:
      measure: acq_first_time_subscribers

  - name: blended_cac_usd
    label: Blended CAC (USD)
    description: >
      All paid media spend divided by first-time paying subscribers. Includes
      organic sign-ups, so it cannot rank channels or be split by platform.
      Small monthly counts make single months noisy; ask for quarter or year.
    type: ratio
    type_params:
      numerator: acq_paid_spend_usd
      denominator: acq_first_time_subscribers

  # ---- owned channels: email and push (by channel, campaign_type, time) -----------
  - name: messages_sent
    label: Messages sent (email and push)
    description: Messages sent in the period. Messages, not people. Slice by message_month__channel or message_month__campaign_type.
    type: simple
    type_params:
      measure: msg_sends

  - name: messages_bounced
    label: Messages bounced
    type: simple
    type_params:
      measure: msg_bounces

  - name: messages_delivered
    label: Messages delivered (sends minus bounces)
    description: There is no delivered event; delivered is sends minus bounces.
    type: simple
    type_params:
      measure: msg_delivered

  - name: messages_opened
    label: Messages opened
    description: A tracked open event (at most one per message). Compare channels and months, not outside benchmarks.
    type: simple
    type_params:
      measure: msg_opens

  - name: messages_clicked
    label: Messages clicked
    type: simple
    type_params:
      measure: msg_clicks

  - name: messages_unsubscribed
    label: Unsubscribes after a message
    type: simple
    type_params:
      measure: msg_unsubscribes

  - name: message_bounce_rate
    label: Bounce rate (fraction of sends)
    type: ratio
    type_params:
      numerator: messages_bounced
      denominator: messages_sent

  - name: message_open_rate
    label: Open rate (fraction of delivered)
    description: Opens divided by delivered. A tracked-event rate, not an outside benchmark.
    type: ratio
    type_params:
      numerator: messages_opened
      denominator: messages_delivered

  - name: message_click_rate
    label: Click rate (fraction of delivered)
    type: ratio
    type_params:
      numerator: messages_clicked
      denominator: messages_delivered

  - name: message_click_to_open_rate
    label: Click-to-open rate (clicks / opens)
    type: ratio
    type_params:
      numerator: messages_clicked
      denominator: messages_opened

  - name: message_unsubscribe_rate
    label: Unsubscribe rate (fraction of delivered)
    type: ratio
    type_params:
      numerator: messages_unsubscribed
      denominator: messages_delivered

  # ---- owned channels: web and app traffic (by traffic_source, landing_page, time) --
  - name: traffic_sessions
    label: Sessions (web and app)
    description: >
      Visits, not people or sales. Slice by traffic_month__traffic_source or
      traffic_month__landing_page. A session tagged with an ad platform arrived through
      that platform's link; it is not attributed revenue or a subscriber.
    type: simple
    type_params:
      measure: sessions_sum

  - name: traffic_known_sessions
    label: Sessions tied to a customer account
    type: simple
    type_params:
      measure: known_sessions_sum

  - name: traffic_anonymous_sessions
    label: Anonymous web sessions
    type: simple
    type_params:
      measure: anonymous_sessions_sum

  - name: traffic_duration_seconds
    label: Total session time (seconds)
    type: simple
    type_params:
      measure: duration_seconds_sum

  - name: traffic_known_share
    label: Known share of sessions (fraction)
    type: ratio
    type_params:
      numerator: traffic_known_sessions
      denominator: traffic_sessions

  - name: traffic_avg_session_seconds
    label: Average session length (seconds)
    type: ratio
    type_params:
      numerator: traffic_duration_seconds
      denominator: traffic_sessions
