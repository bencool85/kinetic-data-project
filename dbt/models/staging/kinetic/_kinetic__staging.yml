  - name: stg_kinetic__tiktok_campaigns
    description: >
      One row per TikTok campaign. The single raw budget is split into daily_budget_usd
      / lifetime_budget_usd by budget_mode, matching the other platforms.
    columns:
      - name: campaign_id
        description: Unique ID of the TikTok campaign.
        data_tests:
          - not_null
          - unique
      - name: tiktok_advertiser_id
        description: Kinetic's TikTok advertiser account, not a customer.
      - name: campaign_name
        description: Human-readable campaign name.
      - name: ad_objective
        description: >-
          What the advertiser told the platform the campaign is optimising for (for
          example awareness, traffic or conversions). Kinetic's own label, shared
          across platforms.
      - name: objective_type
        description: TikTok's own objective code.
      - name: campaign_status
        description: Whether the campaign is active, paused or ended.
      - name: budget_mode
        description: >-
          Whether budget_micro is a daily or a total (lifetime) budget.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - BUDGET_MODE_DAY
                  - BUDGET_MODE_TOTAL
      - name: budget_micro
        description: >-
          Raw budget in micros; whether it is daily or total depends on budget_mode.
          Use daily_budget_usd / lifetime_budget_usd.
      - name: daily_budget_usd
        description: >-
          Campaign's CURRENT daily budget in US dollars. Null for lifetime-budget
          campaigns. Budgets are today's setting, not a history.
      - name: lifetime_budget_usd
        description: >-
          Campaign's CURRENT total (lifetime) budget in US dollars. Null for always-on
          campaigns that have a daily budget.
      - name: start_time
        description: When the campaign is scheduled to start.
      - name: end_time
        description: When the campaign is scheduled to end; null if always-on.
      - name: campaign_created_at
        description: When the campaign record was created.
