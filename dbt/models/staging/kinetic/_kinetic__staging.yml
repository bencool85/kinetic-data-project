    columns:
      - name: variant_id
        description: Unique ID of the variant.
        data_tests:
          - not_null
          - unique
      - name: product_id
        description: ID of the product.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_kinetic__products')
                field: product_id
      - name: sku
        description: Stock-keeping unit code of the variant.
        data_tests:
          - not_null
          - unique
