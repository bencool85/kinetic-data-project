      - name: report_date
        description: The calendar day the platform's numbers are reported for.
      - name: impressions
        description: Number of times the ad was shown.
      - name: swipes
        description: 'Swipe-ups on the ad: Snap''s equivalent of clicks.'
      - name: video_views
        description: >-
          Number of times a video ad was viewed, using the platform's own definition
