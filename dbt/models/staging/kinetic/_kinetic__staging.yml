  - name: stg_kinetic__dv360_insertion_orders
    description: >
      One row per DV360 insertion order (campaign-level budget container). monthly_budget_usd
      is the current monthly budget; no month's spend exceeds it.
    columns:
      - name: insertion_order_id
        description: Unique ID of the DV360 insertion order (a budget container).
        data_tests:
          - not_null
          - unique
      - name: dv360_advertiser_id
        description: Kinetic's DV360 advertiser account, not a customer.
      - name: insertion_order_name
        description: Insertion order name.
      - name: ad_objective
        description: >-
          What the advertiser told the platform the campaign is optimising for (for
          example awareness, traffic or conversions). Kinetic's own label, shared
          across platforms.
      - name: performance_goal_type
        description: Goal DV360 optimises toward (CPM, viewable CPM or CPA).
      - name: pacing_type
        description: How spend is spread over time (even pacing).
      - name: budget_type
        description: How the budget is set (automatic).
      - name: monthly_budget_micros
        description: >-
          Raw monthly budget in micros. Kept for traceability; use monthly_budget_usd.
