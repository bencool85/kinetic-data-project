      - name: ad_status
        description: Whether the ad is active, paused or archived.
      - name: ad_created_at
        description: When the ad record was created.
  - name: stg_kinetic__snap_stats_daily
    description: >-
      One row per Snap ad per day. Swipes are Snap's clicks; spend in micros and
