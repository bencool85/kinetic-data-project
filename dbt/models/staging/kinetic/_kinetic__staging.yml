                field: line_item_id
      - name: insertion_order_id
        description: ID of the insertion order the line item belongs to.
      - name: report_date
        description: The calendar day the platform's numbers are reported for.
      - name: exchange
        description: Ad exchange the impressions were bought on.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - GOOGLE_AD_MANAGER
                  - APPNEXUS
                  - OPENX
                  - PUBMATIC
                  - INDEX_EXCHANGE
      - name: environment
        description: >-
          Where the ad ran: WEB_OPTIMIZED, WEB_NOT_OPTIMIZED, APP or CONNECTED_TV.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - WEB_OPTIMIZED
                  - WEB_NOT_OPTIMIZED
                  - APP
                  - CONNECTED_TV
      - name: impressions
        description: Number of times the ad was shown.
      - name: clicks
        description: Number of clicks on the ad. Platform-reported.
      - name: cost_micros
        description: >-
          Raw spend in micros (millionths of a dollar). Kept for traceability; use
          cost_usd.
      - name: cost_usd
        description: >-
          Spend in US dollars for this slice. Sum across exchange and environment
          for a line-item-day figure.
      - name: cpm_usd
        description: Cost per thousand impressions in US dollars.
      - name: ctr_fraction
        description: >-
          Click-through rate as a fraction (0.017 means 1.7%), not a percentage.
      - name: conversions
        description: Conversions DV360 claims. Self-reported; not Kinetic orders.
      - name: conversions_value_usd
        description: >-
          Value in US dollars of the conversions the platform claims. Self-reported,
          not verified against Kinetic orders.
  - name: stg_kinetic__snap_campaigns
    description: >-
      One row per Snap campaign. Budgets are current budgets, in micros and dollars.
    columns:
      - name: campaign_id
        description: Unique ID of the Snap campaign.
        data_tests:
          - not_null
          - unique
      - name: snap_ad_account_id
        description: Kinetic's Snap ad account, not a customer.
      - name: campaign_name
        description: Human-readable campaign name.
      - name: ad_objective
        description: >-
          What the advertiser told the platform the campaign is optimising for (for
          example awareness, traffic or conversions). Kinetic's own label, shared
          across platforms.
      - name: objective
        description: Snap's own objective code.
      - name: campaign_status
        description: Whether the campaign is active, paused or ended.
      - name: daily_budget_micro
        description: >-
          Raw daily budget in micros. Kept for traceability; use daily_budget_usd.
      - name: daily_budget_usd
        description: >-
          Campaign's CURRENT daily budget in US dollars. Null for lifetime-budget
          campaigns. Budgets are today's setting, not a history.
      - name: lifetime_budget_micro
        description: Raw lifetime budget in micros; use lifetime_budget_usd.
      - name: lifetime_budget_usd
        description: >-
          Campaign's CURRENT total (lifetime) budget in US dollars. Null for always-on
          campaigns that have a daily budget.
      - name: start_time
        description: When the campaign is scheduled to start.
      - name: end_time
        description: When the campaign is scheduled to end; null if always-on.
      - name: campaign_created_at
        description: When the campaign record was created.
      - name: campaign_updated_at
        description: When the campaign was last changed.
  - name: stg_kinetic__snap_ad_squads
    description: >-
      One row per Snap ad squad (Snap's equivalent of an ad set / ad group).
    columns:
      - name: ad_squad_id
        description: >-
          Unique ID of the Snap ad squad (Snap's name for an ad group).
        data_tests:
          - not_null
          - unique
      - name: campaign_id
        description: Campaign the ad squad belongs to.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_kinetic__snap_campaigns')
                field: campaign_id
      - name: ad_squad_name
        description: Ad squad name.
      - name: ad_squad_status
        description: Whether the ad squad is active or paused.
      - name: targeting_segment_id
        description: >-
          ID of the Kinetic audience segment this ad group or ad targets (joins
          to stg_kinetic__segments).
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_kinetic__segments')
                field: segment_id
      - name: optimization_goal
        description: The outcome the platform is told to optimise delivery for.
      - name: ad_squad_created_at
        description: When it was created.
  - name: stg_kinetic__snap_ads
    description: One row per Snap ad.
    columns:
      - name: ad_id
        description: Unique ID of the Snap ad.
        data_tests:
          - not_null
