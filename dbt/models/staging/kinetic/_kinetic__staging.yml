version: 2

models:
  - name: stg_kinetic__customers
    description: One row per customer, 1:1 with the raw customers table.
    columns:
      - name: customer_id
        data_tests: [not_null, unique]

  - name: stg_kinetic__subscription_plans
    description: One row per subscription plan (tier x billing interval).
    columns:
      - name: plan_id
        data_tests: [not_null, unique]

  - name: stg_kinetic__subscriptions
    description: One row per subscription object (Stripe-shaped).
    columns:
      - name: subscription_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__customers')
              field: customer_id
      - name: plan_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__subscription_plans')
              field: plan_id

  - name: stg_kinetic__invoices
    description: One row per invoice generated for a subscription.
    columns:
      - name: invoice_id
        data_tests: [not_null, unique]
      - name: subscription_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__subscriptions')
              field: subscription_id

  - name: stg_kinetic__products
    description: One row per sellable product (course or merch).
    columns:
      - name: product_id
        data_tests: [not_null, unique]

  - name: stg_kinetic__orders
    description: One row per order (customer or guest checkout).
    columns:
      - name: order_id
        data_tests: [not_null, unique]

  - name: stg_kinetic__order_line_items
    description: One row per line item on an order.
    columns:
      - name: line_item_id
        data_tests: [not_null, unique]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__orders')
              field: order_id

  - name: stg_kinetic__payments
    description: One row per payment attempt against an order.
    columns:
      - name: payment_id
        data_tests: [not_null, unique]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__orders')
              field: order_id

  - name: stg_kinetic__refunds
    description: One row per refund issued against a payment.
    columns:
      - name: refund_id
        data_tests: [not_null, unique]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__orders')
              field: order_id

  - name: stg_kinetic__discount_codes
    description: One row per discount code definition.
    columns:
      - name: discount_code_id
        data_tests: [not_null, unique]

  # --- Customer 360 (Phase 2, sub-batch 1) ---
  - name: stg_kinetic__customer_addresses
    description: One row per billing or shipping address on file for a customer.
    columns:
      - name: address_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__customers')
              field: customer_id

  - name: stg_kinetic__devices
    description: >
      One row per device seen on web or app. customer_id is null for anonymous
      devices that never resolved to a known customer -- expected, not a gap.
    columns:
      - name: device_id
        data_tests: [not_null, unique]
      - name: anonymous_id
        data_tests: [not_null]
      - name: customer_id
        data_tests:
          - relationships:
              to: ref('stg_kinetic__customers')
              field: customer_id

  - name: stg_kinetic__identity_map
    description: One row per event that resolved an anonymous_id to a known customer.
    columns:
      - name: resolution_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__customers')
              field: customer_id
      - name: anonymous_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__devices')
              field: anonymous_id

  - name: stg_kinetic__segments
    description: One row per audience segment definition (customer-grain or anonymous-device-grain).
    columns:
      - name: segment_id
        data_tests: [not_null, unique]

  - name: stg_kinetic__customer_segment_membership
    description: One row per period a customer spent in a segment (exited_at null = still a member).
    columns:
      - name: membership_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__customers')
              field: customer_id
      - name: segment_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__segments')
              field: segment_id

  - name: stg_kinetic__subscription_events
    description: One row per lifecycle event on a subscription (trial started, renewed, upgraded, canceled, etc.).
    columns:
      - name: event_id
        data_tests: [not_null, unique]
      - name: subscription_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__subscriptions')
              field: subscription_id
      - name: old_plan_id
        data_tests:
          - relationships:
              to: ref('stg_kinetic__subscription_plans')
              field: plan_id
      - name: new_plan_id
        data_tests:
          - relationships:
              to: ref('stg_kinetic__subscription_plans')
              field: plan_id

  # --- Web/app engagement (Phase 2, sub-batch 2) ---
  - name: stg_kinetic__web_sessions
    description: >
      One row per website session. customer_id is null when the visitor wasn't
      a known customer at the time (~79% of sessions) -- expected, not a gap.
    columns:
      - name: session_id
        data_tests: [not_null, unique]
      - name: anonymous_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__devices')
              field: anonymous_id
      - name: customer_id
        data_tests:
          - relationships:
              to: ref('stg_kinetic__customers')
              field: customer_id

  - name: stg_kinetic__web_events
    description: One row per event on the website (page view, product view, add to cart, checkout, purchase, search).
    columns:
      - name: event_id
        data_tests: [not_null, unique]
      - name: session_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__web_sessions')
              field: session_id
      - name: anonymous_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__devices')
              field: anonymous_id
      - name: customer_id
        data_tests:
          - relationships:
              to: ref('stg_kinetic__customers')
              field: customer_id
      - name: product_id
        data_tests:
          - relationships:
              to: ref('stg_kinetic__products')
              field: product_id
      - name: order_id
        data_tests:
          - relationships:
              to: ref('stg_kinetic__orders')
              field: order_id

  - name: stg_kinetic__app_sessions
    description: One row per session in the Kinetic app (iOS, Android, web app). Always a signed-in customer.
    columns:
      - name: session_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__customers')
              field: customer_id
      - name: device_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__devices')
              field: device_id

  - name: stg_kinetic__app_events
    description: One row per in-app event (class started, workout completed or abandoned, streak achieved).
    columns:
      - name: event_id
        data_tests: [not_null, unique]
      - name: session_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__app_sessions')
              field: session_id
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__customers')
              field: customer_id

  # --- Email/push, Braze (Phase 2, sub-batch 3) ---
  - name: stg_kinetic__braze_email_campaigns
    description: One row per Braze email campaign (triggered or scheduled).
    columns:
      - name: campaign_id
        data_tests: [not_null, unique]

  - name: stg_kinetic__braze_push_campaigns
    description: One row per Braze push notification campaign.
    columns:
      - name: campaign_id
        data_tests: [not_null, unique]

  - name: stg_kinetic__braze_email_events
    description: >
      One row per email event (send, open, click, bounce, unsubscribe).
      customer_id is null for Order Confirmation emails to guest checkouts.
    columns:
      - name: event_id
        data_tests: [not_null, unique]
      - name: send_id
        data_tests: [not_null]
      - name: campaign_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__braze_email_campaigns')
              field: campaign_id
      - name: customer_id
        data_tests:
          - relationships:
              to: ref('stg_kinetic__customers')
              field: customer_id
      - name: email_address
        data_tests: [not_null]
      - name: event_name
        data_tests:
          - accepted_values:
              values: ['send', 'open', 'click', 'bounce', 'unsubscribe']

  - name: stg_kinetic__braze_push_events
    description: One row per push notification event (send, open, click, bounce, unsubscribe). Always a known customer and device.
    columns:
      - name: event_id
        data_tests: [not_null, unique]
      - name: send_id
        data_tests: [not_null]
      - name: campaign_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__braze_push_campaigns')
              field: campaign_id
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__customers')
              field: customer_id
      - name: device_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__devices')
              field: device_id
      - name: event_name
        data_tests:
          - accepted_values:
              values: ['send', 'open', 'click', 'bounce', 'unsubscribe']

  # --- Paid media: Meta (Phase 2, sub-batch 4) ---
  - name: stg_kinetic__meta_campaigns
    description: One row per Meta campaign. Budgets are provided in both cents (raw) and dollars.
    columns:
      - name: campaign_id
        data_tests: [not_null, unique]

  - name: stg_kinetic__meta_ads
    description: One row per Meta ad.
    columns:
      - name: ad_id
        data_tests: [not_null, unique]
      - name: campaign_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__meta_campaigns')
              field: campaign_id
      - name: targeting_segment_id
        data_tests:
          - relationships:
              to: ref('stg_kinetic__segments')
              field: segment_id

  - name: stg_kinetic__meta_ad_insights_daily
    description: >
      One row per Meta ad per day: delivery and spend as Meta reports it.
      spend/cpm/cpc in US dollars; ctr_fraction is a fraction (0.017 = 1.7%).
    columns:
      - name: ad_day_id
        data_tests: [not_null, unique]
      - name: ad_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__meta_ads')
              field: ad_id
      - name: report_date
        data_tests: [not_null]

  - name: stg_kinetic__meta_ad_actions_daily
    description: >
      One row per Meta ad per day per action type. Meta's self-reported
      conversions, not site-verified orders.
    columns:
      - name: ad_day_action_id
        data_tests: [not_null, unique]
      - name: ad_day_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__meta_ad_insights_daily')
              field: ad_day_id
      - name: action_type
        data_tests:
          - accepted_values:
              values: ['link_click', 'landing_page_view', 'video_view', 'add_to_cart', 'initiate_checkout', 'purchase']

  # --- Paid media: Google Search (Phase 2, sub-batch 5) ---
  - name: stg_kinetic__google_search_campaigns
    description: >
      One row per Google Search campaign. google_ads_account_id is the Google
      Ads account number, not a Kinetic customer.
    columns:
      - name: campaign_id
        data_tests: [not_null, unique]

  - name: stg_kinetic__google_search_ad_groups
    description: One row per Google Search ad group.
    columns:
      - name: ad_group_id
        data_tests: [not_null, unique]
      - name: campaign_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__google_search_campaigns')
              field: campaign_id
      - name: targeting_segment_id
        data_tests:
          - relationships:
              to: ref('stg_kinetic__segments')
              field: segment_id

  - name: stg_kinetic__google_search_performance_daily
    description: >
      One row per ad group per day. The keyword table rolled up -- never add
      the two tables together.
    columns:
      - name: ad_group_day_id
        data_tests: [not_null, unique]
      - name: ad_group_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__google_search_ad_groups')
              field: ad_group_id

  - name: stg_kinetic__google_search_keyword_performance_daily
    description: One row per keyword per day -- the most detailed Google Search table.
    columns:
      - name: keyword_day_id
        data_tests: [not_null, unique]
      - name: ad_group_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__google_search_ad_groups')
              field: ad_group_id
      - name: match_type
        data_tests:
          - accepted_values:
              values: ['EXACT', 'PHRASE', 'BROAD']

  # --- Paid media: YouTube (Phase 2, sub-batch 6) ---
  - name: stg_kinetic__youtube_campaigns
    description: >
      One row per YouTube campaign. google_ads_account_id is the Google Ads
      account number, not a Kinetic customer. Budgets in micros and dollars.
    columns:
      - name: campaign_id
        data_tests: [not_null, unique]
      - name: video_ad_format
        data_tests:
          - accepted_values:
              values: ['VIDEO_TRUE_VIEW_IN_STREAM', 'VIDEO_ACTION', 'VIDEO_BUMPER']

  - name: stg_kinetic__youtube_ad_groups
    description: One row per YouTube ad group.
    columns:
      - name: ad_group_id
        data_tests: [not_null, unique]
      - name: campaign_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__youtube_campaigns')
              field: campaign_id
      - name: targeting_segment_id
        data_tests:
          - relationships:
              to: ref('stg_kinetic__segments')
              field: segment_id

  - name: stg_kinetic__youtube_performance_daily
    description: One row per YouTube ad group per day. Cost in micros and dollars; view rate as a fraction.
    columns:
      - name: ad_group_day_id
        data_tests: [not_null, unique]
      - name: ad_group_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__youtube_ad_groups')
              field: ad_group_id

  # --- Paid media: DV360 (Phase 2, sub-batch 7) ---
  - name: stg_kinetic__dv360_insertion_orders
    description: >
      One row per DV360 insertion order (campaign-level budget container).
      monthly_budget_usd is the current monthly budget; no month's spend
      exceeds it.
    columns:
      - name: insertion_order_id
        data_tests: [not_null, unique]

  - name: stg_kinetic__dv360_line_items
    description: One row per DV360 line item.
    columns:
      - name: line_item_id
        data_tests: [not_null, unique]
      - name: insertion_order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__dv360_insertion_orders')
              field: insertion_order_id
      - name: targeting_segment_id
        data_tests:
          - relationships:
              to: ref('stg_kinetic__segments')
              field: segment_id

  - name: stg_kinetic__dv360_performance_daily
    description: >
      One row per line item, per day, per exchange, per environment. Sum
      across exchange and environment for a line-item-day total.
    columns:
      - name: line_item_day_slice_id
        data_tests: [not_null, unique]
      - name: line_item_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__dv360_line_items')
              field: line_item_id
      - name: exchange
        data_tests:
          - accepted_values:
              values: ['GOOGLE_AD_MANAGER', 'APPNEXUS', 'OPENX', 'PUBMATIC', 'INDEX_EXCHANGE']
      - name: environment
        data_tests:
          - accepted_values:
              values: ['WEB_OPTIMIZED', 'WEB_NOT_OPTIMIZED', 'APP', 'CONNECTED_TV']

  # --- Paid media: Snap (Phase 2, sub-batch 8) ---
  - name: stg_kinetic__snap_campaigns
    description: One row per Snap campaign. Budgets are current budgets, in micros and dollars.
    columns:
      - name: campaign_id
        data_tests: [not_null, unique]

  - name: stg_kinetic__snap_ad_squads
    description: One row per Snap ad squad (Snap's equivalent of an ad set / ad group).
    columns:
      - name: ad_squad_id
        data_tests: [not_null, unique]
      - name: campaign_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__snap_campaigns')
              field: campaign_id
      - name: targeting_segment_id
        data_tests:
          - relationships:
              to: ref('stg_kinetic__segments')
              field: segment_id

  - name: stg_kinetic__snap_ads
    description: One row per Snap ad.
    columns:
      - name: ad_id
        data_tests: [not_null, unique]
      - name: ad_squad_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__snap_ad_squads')
              field: ad_squad_id
      - name: ad_type
        data_tests:
          - accepted_values:
              values: ['single_image', 'video', 'collection']

  - name: stg_kinetic__snap_stats_daily
    description: One row per Snap ad per day. Swipes are Snap's clicks; spend in micros and dollars.
    columns:
      - name: ad_day_id
        data_tests: [not_null, unique]
      - name: ad_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__snap_ads')
              field: ad_id

  # --- Paid media: TikTok (Phase 2, sub-batch 9) ---
  - name: stg_kinetic__tiktok_campaigns
    description: >
      One row per TikTok campaign. The single raw budget is split into
      daily_budget_usd / lifetime_budget_usd by budget_mode, matching the
      other platforms.
    columns:
      - name: campaign_id
        data_tests: [not_null, unique]
      - name: budget_mode
        data_tests:
          - accepted_values:
              values: ['BUDGET_MODE_DAY', 'BUDGET_MODE_TOTAL']

  - name: stg_kinetic__tiktok_adgroups
    description: One row per TikTok ad group.
    columns:
      - name: adgroup_id
        data_tests: [not_null, unique]
      - name: campaign_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__tiktok_campaigns')
              field: campaign_id
      - name: targeting_segment_id
        data_tests:
          - relationships:
              to: ref('stg_kinetic__segments')
              field: segment_id

  - name: stg_kinetic__tiktok_ads
    description: One row per TikTok ad.
    columns:
      - name: ad_id
        data_tests: [not_null, unique]
      - name: adgroup_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__tiktok_adgroups')
              field: adgroup_id
      - name: ad_format
        data_tests:
          - accepted_values:
              values: ['SINGLE_VIDEO', 'SPARK_AD', 'COLLECTION']

  - name: stg_kinetic__tiktok_reports_daily
    description: One row per TikTok ad per day. Spend and CPM in micros and dollars; CTR as a fraction.
    columns:
      - name: ad_day_id
        data_tests: [not_null, unique]
      - name: ad_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__tiktok_ads')
              field: ad_id
