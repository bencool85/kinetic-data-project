version: 2

models:
  - name: stg_kinetic__customers
    description: One row per customer, 1:1 with the raw customers table.
    columns:
      - name: customer_id
        data_tests: [not_null, unique]

  - name: stg_kinetic__subscription_plans
    description: One row per subscription plan (tier x billing interval).
    columns:
      - name: plan_id
        data_tests: [not_null, unique]

  - name: stg_kinetic__subscriptions
    description: One row per subscription object (Stripe-shaped).
    columns:
      - name: subscription_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__customers')
              field: customer_id
      - name: plan_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__subscription_plans')
              field: plan_id

  - name: stg_kinetic__invoices
    description: One row per invoice generated for a subscription.
    columns:
      - name: invoice_id
        data_tests: [not_null, unique]
      - name: subscription_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__subscriptions')
              field: subscription_id

  - name: stg_kinetic__products
    description: One row per sellable product (course or merch).
    columns:
      - name: product_id
        data_tests: [not_null, unique]

  - name: stg_kinetic__orders
    description: One row per order (customer or guest checkout).
    columns:
      - name: order_id
        data_tests: [not_null, unique]

  - name: stg_kinetic__order_line_items
    description: One row per line item on an order.
    columns:
      - name: line_item_id
        data_tests: [not_null, unique]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__orders')
              field: order_id

  - name: stg_kinetic__payments
    description: One row per payment attempt against an order.
    columns:
      - name: payment_id
        data_tests: [not_null, unique]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__orders')
              field: order_id

  - name: stg_kinetic__refunds
    description: One row per refund issued against a payment.
    columns:
      - name: refund_id
        data_tests: [not_null, unique]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__orders')
              field: order_id

  - name: stg_kinetic__discount_codes
    description: One row per discount code definition.
    columns:
      - name: discount_code_id
        data_tests: [not_null, unique]

  # --- Customer 360 (Phase 2, sub-batch 1) ---
  - name: stg_kinetic__customer_addresses
    description: One row per billing or shipping address on file for a customer.
    columns:
      - name: address_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__customers')
              field: customer_id

  - name: stg_kinetic__devices
    description: >
      One row per device seen on web or app. customer_id is null for anonymous
      devices that never resolved to a known customer -- expected, not a gap.
    columns:
      - name: device_id
        data_tests: [not_null, unique]
      - name: anonymous_id
        data_tests: [not_null]
      - name: customer_id
        data_tests:
          - relationships:
              to: ref('stg_kinetic__customers')
              field: customer_id

  - name: stg_kinetic__identity_map
    description: One row per event that resolved an anonymous_id to a known customer.
    columns:
      - name: resolution_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__customers')
              field: customer_id
      - name: anonymous_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__devices')
              field: anonymous_id

  - name: stg_kinetic__segments
    description: One row per audience segment definition (customer-grain or anonymous-device-grain).
    columns:
      - name: segment_id
        data_tests: [not_null, unique]

  - name: stg_kinetic__customer_segment_membership
    description: One row per period a customer spent in a segment (exited_at null = still a member).
    columns:
      - name: membership_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__customers')
              field: customer_id
      - name: segment_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__segments')
              field: segment_id

  - name: stg_kinetic__subscription_events
    description: One row per lifecycle event on a subscription (trial started, renewed, upgraded, canceled, etc.).
    columns:
      - name: event_id
        data_tests: [not_null, unique]
      - name: subscription_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__subscriptions')
              field: subscription_id
      - name: old_plan_id
        data_tests:
          - relationships:
              to: ref('stg_kinetic__subscription_plans')
              field: plan_id
      - name: new_plan_id
        data_tests:
          - relationships:
              to: ref('stg_kinetic__subscription_plans')
              field: plan_id

  # --- Web/app engagement (Phase 2, sub-batch 2) ---
  - name: stg_kinetic__web_sessions
    description: >
      One row per website session. customer_id is null when the visitor wasn't
      a known customer at the time (~79% of sessions) -- expected, not a gap.
    columns:
      - name: session_id
        data_tests: [not_null, unique]
      - name: anonymous_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__devices')
              field: anonymous_id
      - name: customer_id
        data_tests:
          - relationships:
              to: ref('stg_kinetic__customers')
              field: customer_id

  - name: stg_kinetic__web_events
    description: One row per event on the website (page view, product view, add to cart, checkout, purchase, search).
    columns:
      - name: event_id
        data_tests: [not_null, unique]
      - name: session_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__web_sessions')
              field: session_id
      - name: anonymous_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__devices')
              field: anonymous_id
      - name: customer_id
        data_tests:
          - relationships:
              to: ref('stg_kinetic__customers')
              field: customer_id
      - name: product_id
        data_tests:
          - relationships:
              to: ref('stg_kinetic__products')
              field: product_id
      - name: order_id
        data_tests:
          - relationships:
              to: ref('stg_kinetic__orders')
              field: order_id

  - name: stg_kinetic__app_sessions
    description: One row per session in the Kinetic app (iOS, Android, web app). Always a signed-in customer.
    columns:
      - name: session_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__customers')
              field: customer_id
      - name: device_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__devices')
              field: device_id

  - name: stg_kinetic__app_events
    description: One row per in-app event (class started, workout completed or abandoned, streak achieved).
    columns:
      - name: event_id
        data_tests: [not_null, unique]
      - name: session_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__app_sessions')
              field: session_id
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kinetic__customers')
              field: customer_id
