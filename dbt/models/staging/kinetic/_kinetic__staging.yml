      - name: spend_micro
        description: >-
          Raw spend in micros (millionths of a dollar). Kept for traceability; use
          spend_usd.
      - name: spend_usd
        description: Advertising spend in US dollars.
      - name: conversions
        description: >-
          Conversions Snap claims. Self-reported and fractional; not Kinetic orders.
      - name: conversions_value_usd
        description: >-
          Value in US dollars of the conversions the platform claims. Self-reported,
